---
- name: Phase 1.5 - Parse ServiceNow Raw CSR & Push to GitHub GitOps Repo
  hosts: localhost
  gather_facts: false

  vars:
    # =========================================================================
    # 1. GitHub 认证与仓库配置区（严格对接你 JT 截图中的 Extra variables）
    # =========================================================================
    github_token: "{{ MY_GITHUB_TOKEN }}"
    github_user: "jerry-wjl"
    github_repo: "SN-Integration-Test"
    github_file_path: "group_vars/all/csr-temp-store.yml" # 写入你指定的临时变量位置
    github_branch: "main"

  tasks:
    # =========================================================================
    # 核心修正 1：完美咬合第一个剧本传过来的 has_work 全局状态
    # =========================================================================
    - name: "1. Safely abort if no work or CSR content detected from Workflow"
      ansible.builtin.meta: end_play
      when: not (has_work | default(false) | bool)

    # =========================================================================
    # 核心修正 2：直接利用第一个剧本清洗并传递过来的 user_csr_content 变量进行 YML 格式化
    # =========================================================================
    #- name: "2. Format CSR Raw Text into key:value Standard YAML Structure"
    #  ansible.builtin.set_fact:
    #    rendered_csr_yaml: |
    #      ---
    #      # Generated by AAP via ServiceNow Incident Gateway
    #      user_csr_content: |
    #        {{ user_csr_content | indent(4, first=true) }}

    # =========================================================================
    # 核心修正 2（外科手术对齐版）：
    # 1. 先用 regex_replace 强行把第一行开头可能存在的无用空格全部抹平
    # 2. 再用 jinja 模版结合缩进，确保第一行到最后一行严格在垂直线上死死对齐
    # =========================================================================
    #- name: "2. Format CSR Raw Text into key:value Standard YAML Structure"
    #  ansible.builtin.set_fact:
    #    rendered_csr_yaml: |
    #      ---
    #      # Generated by AAP via ServiceNow Incident Gateway
    #      user_csr_content: |
    #        {{ user_csr_content | trim | regex_replace('^[ \t]+', '') | indent(4, first=true) }}

    # =========================================================================
    # 核心修正 2（纯净平铺版）：
    # 彻底弃用 indent，改用显式换行符替换。
    # 强行让每一行（包括第一行）的开头前面，都精准、不多不少只有 2 个空格。
    # =========================================================================
    - name: "2. Format CSR Raw Text into key:value Standard YAML Structure"
      ansible.builtin.set_fact:
        rendered_csr_yaml: |
          ---
          # Generated by AAP via ServiceNow Incident Gateway
          user_csr_content: |
            {{ user_csr_content | trim | regex_replace('^[ \t]+', '') | regex_replace('\n', '\n  ') }}

    # 3. 探测 GitHub 远端是否有同名文件，如果有则拿到 SHA 锁以便强制覆盖
    - name: "3. Probe GitHub repo for existing csr-temp-store.yml"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}?ref={{ github_branch }}"
        method: GET
        headers:
          Authorization: "Bearer {{ github_token | trim }}"
          Accept: "application/vnd.github+json"
        status_code: [200, 404]
      register: github_file_check

    - name: "4. Capture SHA lock identifier if file exists"
      ansible.builtin.set_fact:
        existing_file_sha: "{{ github_file_check.json.sha }}"
      when: github_file_check.status == 200

    # 5. 真刀真枪通过 API 发起覆盖操作，抹去旧数据，全量写入新工单的 CSR 矩阵
    - name: "5. Force Overwrite / Create csr-temp-store.yml on GitHub"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}"
        method: PUT
        status_code: [200, 201]
        headers:
          Authorization: "Bearer {{ github_token | trim }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "GitOps Automated Overwrite: Injected CSR from SN Ticket via Pipeline"
          branch: "{{ github_branch }}"
          content: "{{ rendered_csr_yaml | b64encode }}"
          sha: "{{ existing_file_sha | default(omit) }}"
      register: github_api_response

    # 6. 终极可视化控制台大盘
    - name: "6. Visual Dashboard (Final Status Check)"
      ansible.builtin.debug:
        msg: 
          - "=========================================================="
          - "   ENTERPRISE GITOPS CSR GATEWAY DASHBOARD"
          - "=========================================================="
          - "  GITHUB OVERWRITE   : SUCCESS"
          - "  TARGET REPO PATH   : {{ github_file_path }}"
          - "  API STATUS CODE    : {{ github_api_response.status }} (Success)"
          - "=========================================================="
