---
- name: Phase 1.5 - Parse ServiceNow Raw CSR & Push to GitHub GitOps Repo
  hosts: localhost
  gather_facts: false

  vars:
    # =========================================================================
    # 1. GitHub 认证与仓库配置区（严格对齐你在 JT 传入的 Extra Variables）
    # =========================================================================
    github_token: "{{ MY_GITHUB_TOKEN }}"
    github_user: "jerry-wjl"
    github_repo: "SN-Integration-Test"
    github_file_path: "group_vars/all/csr-temp-store.yml" # 写入你指定的相同位置
    github_branch: "main"

  tasks:
    # -------------------------------------------------------------------------
    # 拦截机制：如果没有获取到工单中的 CSR 数据，绿灯平稳退出，不报错
    # -------------------------------------------------------------------------
    - name: "1. Safely abort if no work or CSR content detected"
      ansible.builtin.meta: end_play
      when: >
        incident_result.records is not defined or 
        incident_result.records | length == 0 or 
        (has_work is defined and not has_work | bool)

    # -------------------------------------------------------------------------
    # 核心清洗：抹去工单正文里可能携带的 \r\n 恶性干扰，强行统一为标准 \n 换行符
    # -------------------------------------------------------------------------
    - name: "2. Extract and Sanitize Raw CSR content from ServiceNow incident"
      ansible.builtin.set_fact:
        # 假设前置剧本轮询出的工单描述字段存放在 incident_result.records[0].description 中
        raw_csr_text: "{{ incident_result.records[0].description | regex_replace('\\r\\n', '\n') | trim }}"

    # -------------------------------------------------------------------------
    # 内存渲染：利用 Ansible 的内存过滤器，将 CSR 纯文本重构为带字面量符号 | 且缩进两格的标准 YAML
    # -------------------------------------------------------------------------
    - name: "3. Format CSR Raw Text into key:value Standard YAML Structure"
      ansible.builtin.set_fact:
        rendered_csr_yaml: |
          ---
          # Generated by AAP via ServiceNow Incident Gateway
          user_csr_content: |
            {{ raw_csr_text | indent(4, first=true) }}

    # -------------------------------------------------------------------------
    # 防坑探测：向 GitHub 确认该文件是否存在，如存在则夺取 SHA 指针，确保允许强制全量覆盖
    # -------------------------------------------------------------------------
    - name: "4. Probe GitHub repo for existing csr-temp-store.yml"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}?ref={{ github_branch }}"
        method: GET
        headers:
          Authorization: "Bearer {{ github_token | trim }}"
          Accept: "application/vnd.github+json"
        status_code: [200, 404]
      register: github_file_check

    - name: "5. Capture SHA lock identifier if file exists"
      ansible.builtin.set_fact:
        existing_file_sha: "{{ github_file_check.json.sha }}"
      when: github_file_check.status == 200

    # -------------------------------------------------------------------------
    # 终极一枪：通过 REST API 将 Base64 编码后的标准 YAML 格式空降到 GitHub 仓库
    # -------------------------------------------------------------------------
    - name: "6. Force Overwrite / Create csr-temp-store.yml on GitHub"
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}"
        method: PUT
        status_code: [200, 201]
        headers:
          Authorization: "Bearer {{ github_token | trim }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "GitOps Automated Overwrite: Injected CSR from Ticket {{ incident_result.records[0].number | default('UNKNOWN') }}"
          branch: "{{ github_branch }}"
          content: "{{ rendered_csr_yaml | b64encode }}"
          sha: "{{ existing_file_sha | default(omit) }}"
      register: github_api_response

    # -------------------------------------------------------------------------
    # 专门为你 Demo 演示和 Relaunch 校验提供的可视化大盘
    # -------------------------------------------------------------------------
    - name: "7. Visual Dashboard (CSR Processing Status)"
      ansible.builtin.debug:
        msg: 
          - "=========================================================="
          - "   ENTERPRISE GITOPS CSR GATEWAY DASHBOARD"
          - "=========================================================="
          - "  GITHUB EXPULSION   : SUCCESS"
          - "  TARGET REPO PATH   : {{ github_file_path }}"
          - "  API STATUS CODE    : {{ github_api_response.status }}"
          - "=========================================================="
