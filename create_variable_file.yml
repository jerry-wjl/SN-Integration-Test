---
- name: Executioner B - Full Context Formatter & GitHub Pusher & AAP Re-syncer
  hosts: localhost
  gather_facts: false

  vars:
    # 1. GitHub 认证与仓库配置区
    github_token: "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"
    github_user: "jerry-wjl"
    github_repo: "SN-Integration-Test"
    github_file_path: "group_vars/all/runtime_poc_config.yml"
    github_branch: "main"

    # 2. AAP 自身联动配置区 (用于触发最后一小节的 Project Re-sync)
    # 在 AAP 的 Job Template 运行时，系统会自动隐式提供这两个环境变量，直接 lookup 即可
    aap_host: "{{ lookup('env', 'TOWER_HOST') }}"
    aap_token: "{{ lookup('env', 'TOWER_OAUTH_TOKEN') }}"
    # ★ 核心填写：请去你 AAP 网页端查看你这个 Git 项目（Project）的数字 ID 是多少（比如 10 或 14），填在这里
    aap_project_id: 14 

  tasks:
    # =========================================================================
    # 核心考虑 1：双重拦截。若无工单数据，绿灯平稳安全退出，不报错
    # =========================================================================
    - name: 1. Safely abort if no work detected from Sentinel A
      ansible.builtin.meta: end_play
      when: not (has_work | default(false) | bool)

    # 2. 只有工单有数据才会走到这里：在内存中利用 template 渲染完整的多行 yml
    - name: 2. Render Full Configuration into Memory Variable
      ansible.builtin.set_fact:
        rendered_yaml_content: "{{ lookup('ansible.builtin.template', 'poc_config.j2') }}"

    # =========================================================================
    # 核心考虑 2：探测 GitHub 远端是否有同名文件，如果有则拿到 SHA 锁以便强制覆盖
    # =========================================================================
    - name: 3. Probe GitHub for existing variable file to fetch SHA
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}?ref={{ github_branch }}"
        method: GET
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        status_code: [200, 404]
      register: github_file_check

    - name: 4. Extract SHA lock for forced overwrite override
      ansible.builtin.set_fact:
        existing_file_sha: "{{ github_file_check.json.sha }}"
      when: github_file_check.status == 200

    # 5. 真刀真枪通过 API 发起覆盖操作（抹去旧数据，全量写入新工单的 VM 矩阵）
    - name: 5. Force Overwrite / Create Variable File on GitHub
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_user }}/{{ github_repo }}/contents/{{ github_file_path }}"
        method: PUT
        status_code: [200, 201]
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          message: "GitOps Overwrite: Injected VM specs from SN Ticket {{ provision_data.ticket_context.number }}"
          branch: "{{ github_branch }}"
          content: "{{ rendered_yaml_content | b64encode }}"
          sha: "{{ existing_file_sha | default(omit) }}"
      register: github_api_response

    # =========================================================================
    # 核心考虑 3：数据推成功后，立刻通过官方模块命令 AAP 自身发起 Project 强制重新同步
    # =========================================================================
    - name: 6. Trigger AAP Project Re-sync immediately to pull fresh variables
      awx.awx.project_update:
        # 联动你当前的 AAP 环境凭据
        project: "{{ aap_project_id }}"
        controller_host: "{{ aap_host }}"
        controller_oath_token: "{{ aap_token }}"
        validate_certs: false
        # wait=true 代表这个任务会在这里“挂起等待”，直到 AAP 彻底把 Git 代码拉完对齐了才会结束本剧本。
        # 这样能100%确保 Workflow 里的下一个部署 Job 起来时，本地缓存里已经有这个文件了！
        wait: true 
      register: project_sync_out
      when: github_api_response.status in [200, 201]

    # 7. 终极可视化控制台大盘
    - name: 7. Visual Dashboard (Final Status Check)
      ansible.builtin.debug:
        msg: 
          - "=========================================================="
          - "   ENTERPRISE GITOPS WORKFLOW DASHBOARD"
          - "=========================================================="
          - "  PROCESSED TICKET   : {{ provision_data.ticket_context.number }}"
          - "  VMS IN CONFIG      : {{ provision_data.vm_list | length }}"
          - "  GITHUB OVERWRITE   : SUCCESS"
          - "  AAP PROJECT SYNC   : {{ 'SUCCESS (Cache Refreshed)' if project_sync_out.changed else 'NO CHANGE' }}"
          - "=========================================================="
