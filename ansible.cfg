[defaults]
inventory = ./inventory
remote_user = root
# 核心设置：让 Ansible 优先搜索当前目录下的 collections
collections_paths = ./collections
# 关闭警告（可选）
deprecation_warnings = False
host_key_checking = False

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false
