---
- name: ServiceNow - IIS Certificate CSR Parser
  hosts: localhost
  gather_facts: false
  collections:
    - servicenow.itsm

  tasks:
    # 1. 模糊匹配查询处于 NEW 状态、标题包含关键描述的最早一张工单
    - name: 1. Poll for the OLDEST "New" IIS Cert Request Ticket
      servicenow.itsm.incident_info:
        sysparm_query: "short_descriptionLIKEIIS cert renew request^state=1^ORDERBYsys_created_on"
      register: incident_result

    # 6. 如果没发现任何符合条件的工单，则空跑顺利退出（AAP 会显示为 SUCCESS，但中止后续动作）
    - name: End Play Safely if No Active Ticket Found
      ansible.builtin.meta: end_play
      when: incident_result.records | length == 0

    # 4 & 5. 发现工单后，在提取前先将工单状态由 NEW (1) 变更为 Active (2) 进行锁定，且一次只处理一条记录 [0]
    - name: 2. Lock Ticket (Move Status from NEW to Active)
      servicenow.itsm.incident:
        number: "{{ incident_result.records[0].number }}"
        state: 2 
        other:
          assigned_to: "{{ lookup('env', 'SN_USERNAME') | default('AAP_Automation', true) }}"
          work_notes: "AAP Scheduled Run: Locked and processing CSR content via automation pipeline."

    # 2 & 3. 读取工单 description 内容并剥离前后可能存在的空白字符，注入指定名称的变量
    - name: 3. Extract and Sanitize CSR Content into Target Variable
      ansible.builtin.set_fact:
        user_csr_content: "{{ incident_result.records[0].description | trim }}"
        ticket_number: "{{ incident_result.records[0].number }}"
        ticket_sys_id: "{{ incident_result.records[0].sys_id }}"

    # Debug 调试阶段在控制台打印，确保在 AAP 执行时能够肉眼可见
    - name: 4. Debug Output extracted CSR Context
      ansible.builtin.debug:
        msg: 
          - "Processing Ticket: {{ ticket_number }}"
          - "Extracted CSR content length: {{ user_csr_content | length }} characters"
          - "======================================================================="
          - "{{ user_csr_content }}"

    # 将数据打包交接，使整个 Workflow 工作流中的后续子模版都能直接用 {{ user_csr_content }}
    - name: 5. Handover Variable to Downstream Workflow Tasks
      ansible.builtin.set_stats:
        data:
          user_csr_content: "{{ user_csr_content }}"
          ticket_context:
            number: "{{ ticket_number }}"
            sys_id: "{{ ticket_sys_id }}"
          has_work: true
