---
- name: ServiceNow - IIS Certificate CSR Parser (AAP Console Display Version)
  hosts: localhost
  gather_facts: false
  collections:
    - servicenow.itsm

  tasks:
    # 1. 模糊匹配查询处于 NEW 状态、标题包含关键描述的最早一张工单
    - name: 1. Poll for the OLDEST "New" IIS Cert Request Ticket
      servicenow.itsm.incident_info:
        sysparm_query: "short_descriptionLIKEIIS cert renew request^state=1^ORDERBYsys_created_on"
      register: incident_result

    # 2. 如果没发现任何符合条件的工单，则空跑顺利退出
    - name: End Play Safely if No Active Ticket Found
      ansible.builtin.meta: end_play
      when: incident_result.records | length == 0

    # 3. 锁定工单（状态由 NEW 变更为 Active）
    - name: 2. Lock Ticket (Move Status from NEW to Active)
      servicenow.itsm.incident:
        number: "{{ incident_result.records[0].number }}"
        state: 2 
        other:
          assigned_to: "{{ lookup('env', 'SN_USERNAME') | default('AAP_Automation', true) }}"
          work_notes: "AAP Scheduled Run: Locked and processing CSR content via automation pipeline."

    # 4. 【核心清洗逻辑】：使用 regex_replace 强制剔除 Windows 换行符的污染
    - name: 3. Extract and Sanitize CSR Content into Target Variable
      ansible.builtin.set_fact:
        user_csr_content: "{{ incident_result.records[0].description | regex_replace('\\r\\n', '\n') | trim }}"
        ticket_number: "{{ incident_result.records[0].number }}"

    # 5. 【终极显示】直接在 AAP 控制台输出规范的“变量名：变量值”矩阵（无视转义，完美呈现）
    - name: 4. SHOW OUTPUT FOR USER (VARIABLE_NAME: VARIABLE_VALUE)
      ansible.builtin.debug:
        msg: |
          =========================================
          [VARIABLE_NAME]: user_csr_content
          [VARIABLE_VALUE]:
          {{ user_csr_content }}
          =========================================

    # 6. 打包统计变量，供流水线后续的 Workflow 子模板继承调用
    - name: 5. Handover Variable to Downstream Workflow Tasks
      ansible.builtin.set_stats:
        data:
          user_csr_content: "{{ user_csr_content }}"
          has_work: true
