---
- name: ServiceNow - IIS Certificate CSR Parser
  hosts: localhost
  gather_facts: false
  collections:
    - servicenow.itsm

  vars:
    local_vars_file: "/tmp/csr_vars.yml"

  tasks:
    - name: 1. Poll for the OLDEST "New" IIS Cert Request Ticket
      servicenow.itsm.incident_info:
        sysparm_query: "short_descriptionLIKEIIS cert renew request^state=1^ORDERBYsys_created_on"
      register: incident_result

    - name: End Play Safely if No Active Ticket Found
      ansible.builtin.meta: end_play
      when: incident_result.records | length == 0

    - name: 2. Lock Ticket (Move Status from NEW to Active)
      servicenow.itsm.incident:
        number: "{{ incident_result.records[0].number }}"
        state: 2 
        other:
          assigned_to: "{{ lookup('env', 'SN_USERNAME') | default('AAP_Automation', true) }}"
          work_notes: "AAP Scheduled Run: Locked and processing CSR content via automation pipeline."

    - name: 3. Extract and Sanitize CSR Content into Target Variable
      ansible.builtin.set_fact:
        user_csr_content: "{{ incident_result.records[0].description | regex_replace('\\r\\n', '\n') | trim }}"
        ticket_number: "{{ incident_result.records[0].number }}"

    # 【精准修复对齐】去掉复杂的 indent 算法，改用金牌标准的 YAML 多行换行符注入。
    # 这样写落盘后的文件不仅 user_csr_content 格式完美，首尾两行减号也会严格垂直对齐。
    - name: 4. Write Standard Variable File for Downstream Tasks
      ansible.builtin.copy:
        content: |
          user_csr_content: |
            {{ user_csr_content | regex_replace('\n', '\n    ') }}
        dest: "{{ local_vars_file }}"
        mode: '0644'

    - name: 5. FORCE PRINT PERFECT TEXT MATRIX ON AAP CONSOLE
      ansible.builtin.shell: |
        echo "======================================================================="
        echo "VARIABLE_NAME: user_csr_content"
        echo "VARIABLE_VALUE IS SHOWN BELOW (NO TRUNCATION, NO \r\n):"
        echo "======================================================================="
        cat "{{ local_vars_file }}"
        echo "======================================================================="
      register: output_screen

    - name: 6. Display Screen Output
      ansible.builtin.debug:
        var: output_screen.stdout_lines

    - name: 7. Handover Variable to Downstream Workflow Tasks
      ansible.builtin.set_stats:
        data:
          user_csr_content: "{{ user_csr_content }}"
          local_vars_file: "{{ local_vars_file }}"
          has_work: true
